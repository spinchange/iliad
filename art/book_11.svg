<svg viewBox="0 0 600 800" width="600" height="800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Plate for Iliad Book 11: The Long Day — a Geometric emblem in pale bone on a wine-dark ground.">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46192b"/>
      <stop offset="0.55" stop-color="#331323"/>
      <stop offset="1" stop-color="#1e0b15"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.85">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0408" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="meander" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ead9b4" stroke-width="3.6">
        <path d="M0 5 H40"/><path d="M0 34 H40"/><path d="M28 34 V11 H11 V26 H19"/>
      </g>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#wine)"/>
  <rect width="600" height="800" fill="#ead9b4" filter="url(#grain)"/>
  <rect width="600" height="800" fill="url(#vig)"/>

  <rect x="28" y="28" width="544" height="744" fill="none" stroke="#ead9b4" stroke-width="2.2" opacity="0.9"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#ead9b4" stroke-width="1" opacity="0.38"/>
  <rect x="70" y="58" width="460" height="34" fill="url(#meander)"/>

  <g stroke="#ead9b4" fill="none" stroke-linecap="round">
  <circle cx="300" cy="358" r="30" fill="#ead9b4" stroke="#ead9b4" stroke-width="2"/>
  <line x1="300.0" y1="320.0" x2="300.0" y2="308.0" stroke-width="2.6"/>
  <line x1="319.0" y1="325.1" x2="325.0" y2="314.7" stroke-width="2.6"/>
  <line x1="332.9" y1="339.0" x2="343.3" y2="333.0" stroke-width="2.6"/>
  <line x1="338.0" y1="358.0" x2="350.0" y2="358.0" stroke-width="2.6"/>
  <line x1="332.9" y1="377.0" x2="343.3" y2="383.0" stroke-width="2.6"/>
  <line x1="319.0" y1="390.9" x2="325.0" y2="401.3" stroke-width="2.6"/>
  <line x1="300.0" y1="396.0" x2="300.0" y2="408.0" stroke-width="2.6"/>
  <line x1="281.0" y1="390.9" x2="275.0" y2="401.3" stroke-width="2.6"/>
  <line x1="267.1" y1="377.0" x2="256.7" y2="383.0" stroke-width="2.6"/>
  <line x1="262.0" y1="358.0" x2="250.0" y2="358.0" stroke-width="2.6"/>
  <line x1="267.1" y1="339.0" x2="256.7" y2="333.0" stroke-width="2.6"/>
  <line x1="281.0" y1="325.1" x2="275.0" y2="314.7" stroke-width="2.6"/>
  <line x1="210" y1="436" x2="210" y2="534" stroke-width="3"/>
  <path d="M204 449 L210 436 L216 449 Z" fill="#ead9b4" stroke="none"/>
  <line x1="240" y1="446" x2="240" y2="534" stroke-width="3"/>
  <path d="M234 459 L240 446 L246 459 Z" fill="#ead9b4" stroke="none"/>
  <line x1="270" y1="436" x2="270" y2="534" stroke-width="3"/>
  <path d="M264 449 L270 436 L276 449 Z" fill="#ead9b4" stroke="none"/>
  <line x1="300" y1="446" x2="300" y2="534" stroke-width="3"/>
  <path d="M294 459 L300 446 L306 459 Z" fill="#ead9b4" stroke="none"/>
  <line x1="330" y1="436" x2="330" y2="534" stroke-width="3"/>
  <path d="M324 449 L330 436 L336 449 Z" fill="#ead9b4" stroke="none"/>
  <line x1="360" y1="446" x2="360" y2="534" stroke-width="3"/>
  <path d="M354 459 L360 446 L366 459 Z" fill="#ead9b4" stroke="none"/>
  <line x1="390" y1="436" x2="390" y2="534" stroke-width="3"/>
  <path d="M384 449 L390 436 L396 449 Z" fill="#ead9b4" stroke="none"/>
</g>

  <!-- the tondo that holds the emblem -->
  <circle cx="300" cy="430" r="150" fill="none" stroke="#ead9b4" stroke-width="2.4" opacity="0.85"/>
  <circle cx="300" cy="430" r="142" fill="none" stroke="#ead9b4" stroke-width="1" opacity="0.35"/>

  <g font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" text-anchor="middle" fill="#ead9b4">
    <text x="300" y="176" font-size="17" letter-spacing="7" opacity="0.62">BOOK</text>
    <text x="300" y="238" font-size="62" fill="#c99b3f">XI</text>
    <line x1="230" y1="640" x2="370" y2="640" stroke="#c99b3f" stroke-width="1.2" opacity="0.85"/>
    <text x="300" y="686" font-size="25" letter-spacing="2">THE LONG DAY</text>
    <text x="300" y="726" font-size="13" font-style="italic" opacity="0.5">HOMER&#8217;S ILIAD</text>
  </g>

  <rect x="70" y="708" width="460" height="34" fill="url(#meander)"/>
</svg>

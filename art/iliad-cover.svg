<svg viewBox="0 0 800 1200" width="800" height="1200" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Book cover for Homer's Iliad — the Shield of Achilles in pale bone on a wine-dark ground, its concentric registers showing the stars, the two cities, the plowland and the dance, ringed by the river Ocean and framed by meander bands.">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46192b"/>
      <stop offset="0.55" stop-color="#331323"/>
      <stop offset="1" stop-color="#1e0b15"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0408" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="meander" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ead9b4" stroke-width="3.6">
        <path d="M0 5 H40"/>
        <path d="M0 34 H40"/>
        <path d="M28 34 V11 H11 V26 H19"/>
      </g>
    </pattern>
    <pattern id="dots" width="15" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.6" fill="#ead9b4"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <!-- ===== Shield register content, defined once, reused by the social cards ===== -->

    <!-- Ocean: the running-wave rim of the outermost circle (18.607-608) -->
    <path id="ocean-wave"
          d="M0 0 c8 -11 20 -11 28 0 c8 11 20 11 28 0"
          fill="none" stroke="#ead9b4" stroke-width="3.2" stroke-linecap="round"/>

    <!-- a Geometric spearman: figure-eight shield, upright spear (18.509-540) -->
    <g id="warrior">
      <!-- spear, held upright behind the body -->
      <line x1="17" y1="10" x2="17" y2="-52" stroke="#ead9b4" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M17 -52 L13 -44 L21 -44 Z" fill="#ead9b4"/>
      <!-- torso: the wasp-waisted Geometric triangle pair -->
      <path d="M-10 0 L10 0 L0 -16 Z" fill="#ead9b4"/>
      <path d="M0 -16 L9 -32 L-9 -32 Z" fill="#ead9b4"/>
      <circle cx="0" cy="-38" r="5.4" fill="#ead9b4"/>
      <!-- legs -->
      <path d="M-4 0 L-9 12 M4 0 L9 12" stroke="#ead9b4" stroke-width="3" stroke-linecap="round"/>
      <!-- figure-eight shield on the near arm -->
      <path d="M-13 -26 a7 7 0 1 1 0 -0.1 M-13 -12 a7 7 0 1 1 0 -0.1"
            fill="none" stroke="#ead9b4" stroke-width="2.8"/>
      <line x1="-9" y1="-32" x2="-2" y2="-26" stroke="#ead9b4" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- dancers, hands joined at the wrist (18.593-594) -->
    <g id="dancer">
      <path d="M-9 0 L9 0 L0 -17 Z" fill="#ead9b4"/>
      <path d="M0 -17 L7 -30 L-7 -30 Z" fill="#ead9b4"/>
      <circle cx="0" cy="-36" r="5" fill="#ead9b4"/>
      <!-- arms out to either side, to be joined with the next dancer -->
      <path d="M-7 -28 L-19 -20 M7 -28 L19 -20" fill="none" stroke="#ead9b4" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-4 0 L-9 11 M4 0 L9 11" stroke="#ead9b4" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- ox at the plow, seen in profile (18.541-549) -->
    <g id="ox">
      <!-- body -->
      <path d="M-17 -8 L13 -8 L13 -20 L-17 -20 Z" fill="#ead9b4"/>
      <!-- legs -->
      <path d="M-14 -8 L-14 6 M-6 -8 L-6 6 M4 -8 L4 6 M11 -8 L11 6"
            stroke="#ead9b4" stroke-width="2.8" stroke-linecap="round"/>
      <!-- head and horns, dropped forward -->
      <path d="M13 -20 L24 -14 L24 -6 L15 -8 Z" fill="#ead9b4"/>
      <path d="M17 -21 L14 -30 M22 -19 L25 -28" fill="none" stroke="#ead9b4" stroke-width="2.4" stroke-linecap="round"/>
      <!-- tail -->
      <path d="M-17 -19 L-24 -26" stroke="#ead9b4" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- eight-spoked star of the heavens ring -->
    <g id="star">
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#ead9b4" stroke-width="2.4"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#ead9b4" stroke-width="2.4"/>
      <line x1="-7.1" y1="-7.1" x2="7.1" y2="7.1" stroke="#ead9b4" stroke-width="2.4"/>
      <line x1="-7.1" y1="7.1" x2="7.1" y2="-7.1" stroke="#ead9b4" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="2.8" fill="#ead9b4"/>
    </g>
  </defs>

  <!-- ground -->
  <rect width="800" height="1200" fill="url(#wine)"/>
  <rect width="800" height="1200" fill="#ead9b4" filter="url(#grain)"/>
  <rect width="800" height="1200" fill="url(#vig)"/>

  <!-- frame -->
  <rect x="36" y="36" width="728" height="1128" fill="none" stroke="#ead9b4" stroke-width="2.5" opacity="0.9"/>
  <rect x="48" y="48" width="704" height="1104" fill="none" stroke="#ead9b4" stroke-width="1" opacity="0.4"/>

  <!-- top meander band -->
  <rect x="80" y="72" width="640" height="40" fill="url(#meander)"/>

  <!-- epigraph -->
  <g font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" text-anchor="middle">
    <text x="400" y="208" font-size="27" font-style="italic" fill="#ead9b4" opacity="0.8">&#956;&#8134;&#957;&#953;&#957; &#7940;&#949;&#953;&#948;&#949;, &#952;&#949;&#940;, &#928;&#951;&#955;&#951;&#970;&#940;&#948;&#949;&#969; &#7944;&#967;&#953;&#955;&#8134;&#959;&#962;</text>
    <text x="400" y="246" font-size="19" fill="#ead9b4" opacity="0.55">Sing, goddess, the wrath of Peleus&#8217; son Achilles</text>
  </g>

  <!-- title -->
  <g font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" text-anchor="middle" fill="#ead9b4">
    <text x="400" y="356" font-size="44" textLength="320" lengthAdjust="spacingAndGlyphs">HOMER&#8217;S</text>
    <text x="400" y="454" font-size="86" textLength="440" lengthAdjust="spacingAndGlyphs">ILIAD</text>
    <line x1="280" y1="486" x2="520" y2="486" stroke="#c99b3f" stroke-width="1.3" opacity="0.9"/>
    <text x="400" y="526" font-size="30" fill="#c99b3f" textLength="220" lengthAdjust="spacingAndGlyphs">&#921;&#923;&#921;&#913;&#931;</text>
    <text x="400" y="568" font-size="18" letter-spacing="2" fill-opacity="0.78">LINE FOR LINE TRANSLATION BY FABLE 5</text>
  </g>

  <!-- shield register: top border -->
  <line x1="90" y1="600" x2="710" y2="600" stroke="#ead9b4" stroke-width="2"/>
  <rect x="100" y="606" width="600" height="12" fill="url(#dots)"/>
  <line x1="90" y1="626" x2="710" y2="626" stroke="#ead9b4" stroke-width="2"/>

  <!-- ================= THE SHIELD OF ACHILLES ================= -->
  <!-- centered at (400,808), outer radius 164; five layers, as the poem says (18.481) -->
  <g>
    <!-- the triple rim, bright and glittering (18.479) -->
    <circle cx="400" cy="808" r="164" fill="none" stroke="#ead9b4" stroke-width="3.4"/>
    <circle cx="400" cy="808" r="158" fill="none" stroke="#ead9b4" stroke-width="1.4" opacity="0.55"/>

    <!-- Ring 1: the great strength of the river Ocean, along the outermost rim (18.607-608) -->
    <circle cx="400" cy="808" r="132" fill="none" stroke="#ead9b4" stroke-width="2.8"/>
    <path d="M400.00 663.00 Q415.68 648.77 428.29 665.79 Q437.74 683.60 455.49 674.04 Q475.42 666.89 480.56 687.44 Q482.47 707.51 502.53 705.47 Q523.68 706.50 520.56 727.44 Q514.65 746.72 533.96 752.51 Q553.11 761.55 542.21 779.71 Q529.37 795.26 545.00 808.00 Q559.23 823.68 542.21 836.29 Q524.40 845.74 533.96 863.49 Q541.11 883.42 520.56 888.56 Q500.49 890.47 502.53 910.53 Q501.50 931.68 480.56 928.56 Q461.28 922.65 455.49 941.96 Q446.45 961.11 428.29 950.21 Q412.74 937.37 400.00 953.00 Q384.32 967.23 371.71 950.21 Q362.26 932.40 344.51 941.96 Q324.58 949.11 319.44 928.56 Q317.53 908.49 297.47 910.53 Q276.32 909.50 279.44 888.56 Q285.35 869.28 266.04 863.49 Q246.89 854.45 257.79 836.29 Q270.63 820.74 255.00 808.00 Q240.77 792.32 257.79 779.71 Q275.60 770.26 266.04 752.51 Q258.89 732.58 279.44 727.44 Q299.51 725.53 297.47 705.47 Q298.50 684.32 319.44 687.44 Q338.72 693.35 344.51 674.04 Q353.55 654.89 371.71 665.79 Q387.26 678.63 400.00 663.00 Z"
          fill="none" stroke="#ead9b4" stroke-width="3.2" stroke-linejoin="round"/>

    <!-- Ring 2: the dancing floor Daedalus made at Knossos (18.590-606) -->
    <circle cx="400" cy="808" r="96" fill="none" stroke="#ead9b4" stroke-width="2.6"/>
    <g transform="translate(400,808)">
      <g transform="translate(0.0,-130.4) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(76.6,-105.5) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(124.0,-40.3) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(124.0,40.3) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(76.6,105.5) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(0.0,130.4) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(-76.6,105.5) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(-124.0,40.3) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(-124.0,-40.3) scale(0.8)"><use href="#dancer"/></g>
      <g transform="translate(-76.6,-105.5) scale(0.8)"><use href="#dancer"/></g>
    </g>

    <!-- Ring 3: the two cities — war above, the plowland and herds below -->
    <circle cx="400" cy="808" r="54" fill="none" stroke="#ead9b4" stroke-width="2.6"/>
    <!-- the city at war (18.509-540) -->
    <g transform="translate(400,808)">
      <g transform="translate(-77.2,-41.0) scale(0.62)"><use href="#warrior"/></g>
      <g transform="translate(-31.3,-81.6) scale(0.62)"><use href="#warrior"/></g>
      <g transform="translate(31.3,-81.6) scale(0.62)"><use href="#warrior"/></g>
      <g transform="translate(77.2,-41.0) scale(0.62)"><use href="#warrior"/></g>
    </g>
    <!-- the plowland: teams wheeling this way and that (18.541-549) -->
    <g transform="translate(400,808)">
      <g transform="translate(74.7,39.7) scale(0.8)"><use href="#ox"/></g>
      <g transform="translate(30.3,79.0) scale(0.8)"><use href="#ox"/></g>
      <g transform="translate(-30.3,79.0) scale(0.8)"><use href="#ox"/></g>
      <g transform="translate(-74.7,39.7) scale(0.8)"><use href="#ox"/></g>
    </g>

    <!-- Ring 4: the constellations with which heaven is crowned (18.485-489) -->
    <circle cx="400" cy="808" r="31" fill="none" stroke="#ead9b4" stroke-width="2.6"/>
    <g transform="translate(400,808)">
      <g transform="translate(0.0,-42.5) scale(0.72)"><use href="#star"/></g>
      <g transform="translate(36.8,-21.3) scale(0.72)"><use href="#star"/></g>
      <g transform="translate(36.8,21.2) scale(0.72)"><use href="#star"/></g>
      <g transform="translate(0.0,42.5) scale(0.72)"><use href="#star"/></g>
      <g transform="translate(-36.8,21.3) scale(0.72)"><use href="#star"/></g>
      <g transform="translate(-36.8,-21.3) scale(0.72)"><use href="#star"/></g>
    </g>

    <!-- Boss: the unwearied sun and the moon at her full (18.484) -->
    <g transform="translate(400,808)">
      <g stroke="#ead9b4" stroke-width="2.6" stroke-linecap="round">
        <line x1="0" y1="-22" x2="0" y2="-28"/>
        <line x1="15.6" y1="-15.6" x2="19.8" y2="-19.8"/>
        <line x1="22" y1="0" x2="28" y2="0"/>
        <line x1="15.6" y1="15.6" x2="19.8" y2="19.8"/>
        <line x1="0" y1="22" x2="0" y2="28"/>
        <line x1="-15.6" y1="15.6" x2="-19.8" y2="19.8"/>
        <line x1="-22" y1="0" x2="-28" y2="0"/>
        <line x1="-15.6" y1="-15.6" x2="-19.8" y2="-19.8"/>
      </g>
      <path d="M0 -19 A19 19 0 1 1 0 19 A13 13 0 1 0 0 -19 Z" fill="#ead9b4"/>
      <circle cx="0" cy="0" r="19" fill="none" stroke="#ead9b4" stroke-width="2.2"/>
    </g>
  </g>

  <!-- shield register: bottom border -->
  <line x1="90" y1="990" x2="710" y2="990" stroke="#ead9b4" stroke-width="2"/>
  <rect x="100" y="996" width="600" height="12" fill="url(#dots)"/>
  <line x1="90" y1="1016" x2="710" y2="1016" stroke="#ead9b4" stroke-width="2"/>

  <!-- byline -->
  <g font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" text-anchor="middle" fill="#ead9b4">
    <text x="400" y="1050" font-size="15" opacity="0.7" letter-spacing="6">TRANSLATED BY</text>
    <text x="400" y="1082" font-size="36" textLength="220" lengthAdjust="spacingAndGlyphs">CLAUDE</text>
    <text x="400" y="1110" font-size="15" font-style="italic" opacity="0.6">24 books &#183; 15,687 lines rendered from the Greek</text>
  </g>

  <!-- bottom meander band -->
  <rect x="80" y="1128" width="640" height="34" fill="url(#meander)"/>
</svg>

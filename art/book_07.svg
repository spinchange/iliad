<svg viewBox="0 0 600 800" width="600" height="800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Plate for Iliad Book 7: The Wall — a Geometric emblem in pale bone on a wine-dark ground.">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46192b"/>
      <stop offset="0.55" stop-color="#331323"/>
      <stop offset="1" stop-color="#1e0b15"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.85">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0408" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="meander" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ead9b4" stroke-width="3.6">
        <path d="M0 5 H40"/><path d="M0 34 H40"/><path d="M28 34 V11 H11 V26 H19"/>
      </g>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#wine)"/>
  <rect width="600" height="800" fill="#ead9b4" filter="url(#grain)"/>
  <rect width="600" height="800" fill="url(#vig)"/>

  <rect x="28" y="28" width="544" height="744" fill="none" stroke="#ead9b4" stroke-width="2.2" opacity="0.9"/>
  <rect x="38" y="38" width="524" height="724" fill="none" stroke="#ead9b4" stroke-width="1" opacity="0.38"/>
  <rect x="70" y="58" width="460" height="34" fill="url(#meander)"/>

  <g stroke="#ead9b4" fill="none">
  <line x1="192" y1="368" x2="408" y2="368" stroke-width="2.6"/>
  <line x1="192" y1="368" x2="192" y2="398" stroke-width="2.2"/>
  <line x1="228" y1="368" x2="228" y2="398" stroke-width="2.2"/>
  <line x1="264" y1="368" x2="264" y2="398" stroke-width="2.2"/>
  <line x1="300" y1="368" x2="300" y2="398" stroke-width="2.2"/>
  <line x1="336" y1="368" x2="336" y2="398" stroke-width="2.2"/>
  <line x1="372" y1="368" x2="372" y2="398" stroke-width="2.2"/>
  <line x1="408" y1="368" x2="408" y2="398" stroke-width="2.2"/>
  <line x1="198" y1="398" x2="402" y2="398" stroke-width="2.6"/>
  <line x1="198" y1="398" x2="198" y2="428" stroke-width="2.2"/>
  <line x1="239" y1="398" x2="239" y2="428" stroke-width="2.2"/>
  <line x1="280" y1="398" x2="280" y2="428" stroke-width="2.2"/>
  <line x1="320" y1="398" x2="320" y2="428" stroke-width="2.2"/>
  <line x1="361" y1="398" x2="361" y2="428" stroke-width="2.2"/>
  <line x1="402" y1="398" x2="402" y2="428" stroke-width="2.2"/>
  <line x1="204" y1="428" x2="396" y2="428" stroke-width="2.6"/>
  <line x1="204" y1="428" x2="204" y2="458" stroke-width="2.2"/>
  <line x1="236" y1="428" x2="236" y2="458" stroke-width="2.2"/>
  <line x1="268" y1="428" x2="268" y2="458" stroke-width="2.2"/>
  <line x1="300" y1="428" x2="300" y2="458" stroke-width="2.2"/>
  <line x1="332" y1="428" x2="332" y2="458" stroke-width="2.2"/>
  <line x1="364" y1="428" x2="364" y2="458" stroke-width="2.2"/>
  <line x1="396" y1="428" x2="396" y2="458" stroke-width="2.2"/>
  <line x1="210" y1="458" x2="390" y2="458" stroke-width="2.6"/>
  <line x1="210" y1="458" x2="210" y2="488" stroke-width="2.2"/>
  <line x1="246" y1="458" x2="246" y2="488" stroke-width="2.2"/>
  <line x1="282" y1="458" x2="282" y2="488" stroke-width="2.2"/>
  <line x1="318" y1="458" x2="318" y2="488" stroke-width="2.2"/>
